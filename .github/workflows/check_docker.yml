name: Check Docker

on:
  push:
    branches: [main, holoscan-sdk-lws2]

permissions:
  contents: read

env:
  HOLOSCAN_CLI_VERSION: holoscan-cli==4.3.0a26390596878
  HOLOSCAN_CLI_INSTALL_EXTRA_FLAGS: "--index-url https://test.pypi.org/simple/"

jobs:
  check-docker-build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        ubuntu_version: [22.04, 24.04]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install holoscan-cli
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            holoscan-cli==4.3.0a26390596878

      - name: Run Docker build
        run: |
          set -o pipefail
          export ubuntu_version=${{ matrix.ubuntu_version }}

          ./holohub build-container --base-img ubuntu:${ubuntu_version} 2>&1 | tee /tmp/build.log
          grep -qE "writing image.* done" /tmp/build.log || { echo "Build failed - no success pattern"; cat /tmp/build.log; exit 1; }

          ./holohub run-container --base-img ubuntu:${ubuntu_version} --no-docker-build --dryrun | grep -q "docker run" || { echo "run-container failed"; exit 1; }
          ./holohub run-container --docker-opts "--memory 4g" --no-docker-build --dryrun | grep -q "memory 4g" || { echo "docker-opts test failed"; exit 1; }
          ./holohub run-container --no-docker-build --add-volume "/tmp" --dryrun | grep -q "/tmp" || { echo "add-volume test failed"; exit 1; }
          ./holohub run-container --no-docker-build --dryrun -- echo hello > /tmp/trailing-args.log 2>&1
          grep -q "hello" /tmp/trailing-args.log || { echo "trailing args test failed"; cat /tmp/trailing-args.log; exit 1; }

          ./holohub run-container --base-img ubuntu:${ubuntu_version} --no-docker-build --dryrun -- "./holohub lint --install-dependencies; ./holohub lint --fix; ./holohub lint" | grep -q "holohub lint"

  test-entrypoint:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile_config: 'CMD ["/bin/sh"]'
            description: "cmd-bin-sh"
          - dockerfile_config: 'CMD ["sh"]'
            description: "cmd-sh"
          - dockerfile_config: |
              RUN echo '#!/bin/sh' > /usr/local/bin/test-entrypoint.sh && \
                  echo 'exec "$@"' >> /usr/local/bin/test-entrypoint.sh && \
                  chmod +x /usr/local/bin/test-entrypoint.sh
              ENTRYPOINT ["/usr/local/bin/test-entrypoint.sh"]
            description: "entrypoint-test"
          - dockerfile_config: |
              RUN echo '#!/bin/sh' > /docker-entrypoint.sh && \
                  echo 'exec "$@"' >> /docker-entrypoint.sh && \
                  chmod +x /docker-entrypoint.sh
              ENTRYPOINT ["/docker-entrypoint.sh"]
              CMD ["echo", "test case"]
            description: "entrypoint-and-cmd"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install holoscan-cli
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://test.pypi.org/simple/ \
            holoscan-cli==4.3.0a26390596878

      - name: Create test Dockerfile
        run: |
          cat > /tmp/test-dockerfile << 'EOF'
          FROM ubuntu:24.04

          # Install basic shell utilities required by ./holohub
          RUN apt-get update && apt-get install -y \
              bash \
              && rm -rf /var/lib/apt/lists/*

          ${{ matrix.dockerfile_config }}
          EOF

      - name: Test run-container with different dockerfile configurations
        run: |
          DOCKERFILE="/tmp/test-dockerfile"
          echo "Testing with ${{ matrix.description }}"
          cat /tmp/test-dockerfile

          ./holohub run-container --docker-file "$DOCKERFILE" --img test_image --dryrun -- echo test

          ./holohub run-container --docker-file "$DOCKERFILE" --img test_image --dryrun -- echo test > /tmp/test.log 2>&1
          grep -q "echo test" /tmp/test.log || { echo "Failed for ${{ matrix.description }}"; cat /tmp/test.log; exit 1; }

          ./holohub run-container --docker-file "$DOCKERFILE" --img test_image --dryrun --docker-opts="--entrypoint=/bin/sh" -- echo override > /tmp/override.log 2>&1
          grep -q "echo override" /tmp/override.log || { echo "Entrypoint override failed for ${{ matrix.description }}"; cat /tmp/override.log; exit 1; }
