name: Check URLs

on:
  push:
    branches: [main]
  pull_request:
jobs:
  check-urls:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get changed files in the PR
      if: github.event_name == 'pull_request'
      id: changed-files
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        # Keep filenames in a file only — never interpolate them into run/action
        # args (GitHub Actions script injection / lychee-action eval).
        # BASE_REF is passed via env so branch names cannot inject into the script.
        if git diff --name-only --diff-filter=d "origin/${BASE_REF}..HEAD" | grep -E '\.(md|html|rst)$' > changed_files.txt; then
          if [ -s changed_files.txt ]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
            while IFS= read -r rel; do
              printf '%s\n' "${GITHUB_WORKSPACE}/${rel}"
            done < changed_files.txt > changed_files_abs.txt
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "any_changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Echo changed files in the PR
      if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
      run: |
        echo "Files being checked:"
        cat changed_files.txt

    # Pass 1: lychee checks everything. It does not fail the job; its failures are
    # written to a JSON report and re-verified in pass 2, because lychee cannot
    # reach some sites that gate on TLS fingerprint (e.g. analog.com behind a WAF).
    # PR path invokes lychee directly with a file-backed argv list so attacker-
    # controlled filenames never enter workflow expressions or lychee-action eval.
    - name: URL checker (PR - changed files only)
      if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
      env:
        # lychee uses GITHUB_TOKEN for GitHub API auth / rate limits (same as lychee-action).
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Same default version as lycheeverse/lychee-action@v2
        LYCHEE_VERSION=v0.16.1
        FILENAME=lychee-x86_64-unknown-linux-gnu.tar.gz
        REPORT=".github/workflows/lychee-report.json"
        curl -sfLO "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/${FILENAME}"
        tar -xzf "${FILENAME}"
        install -t "$HOME/.local/bin" -D lychee
        rm -f "${FILENAME}"
        export PATH="$HOME/.local/bin:$PATH"

        mapfile -t files < changed_files_abs.txt
        rm -f "${REPORT}"
        set +e
        lychee \
          --accept=200,403,429 \
          --max-retries=5 \
          --retry-wait-time=2 \
          --no-progress \
          --base="${GITHUB_WORKSPACE}" \
          --remap='(file://.*)/holoscan-sdk/(.*) https://github.com/nvidia-holoscan/holoscan-sdk/tree/main/$2' \
          --format json \
          --output "${REPORT}" \
          "${files[@]}"
        set -e
        # Link failures are re-verified in pass 2, but a missing report means
        # lychee never ran successfully — fail rather than skipping URL checks.
        if [ ! -f "${REPORT}" ]; then
          echo "lychee did not produce ${REPORT}" >&2
          exit 1
        fi
        exit 0

    - name: URL checker (all files)
      if: github.event_name == 'push'
      uses: lycheeverse/lychee-action@v2
      with:
        workingDirectory: .github/workflows
        format: json
        output: lychee-report.json
        jobSummary: false
        args: >-
          --accept=200,403,429
          --max-retries=5
          --retry-wait-time=2
          --no-progress
          --base=${{ github.workspace }}
          --remap='(file://.*)/holoscan-sdk/(.*) https://github.com/nvidia-holoscan/holoscan-sdk/tree/main/$2'
          '${{ github.workspace }}/**/*.md'
          '${{ github.workspace }}/**/*.html'
          '${{ github.workspace }}/**/*.rst'
        fail: false
        failIfEmpty: false

    # Pass 2: re-verify lychee's failures with a browser-impersonating HEAD. A URL
    # stays failed only if it cannot be confirmed (not HTTP 200), so real dead
    # links (404) still fail while WAF false positives are rescued.
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Re-check lychee failures with browser impersonation
      run: |
        pip install curl_cffi
        python .github/workflows/scripts/recheck_failed_urls.py .github/workflows/lychee-report.json
