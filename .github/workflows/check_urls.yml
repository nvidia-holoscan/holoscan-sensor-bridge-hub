name: Check URLs

on:
  push:
    branches: [main]
  pull_request:
jobs:
  check-urls:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get changed files in the PR
      if: github.event_name == 'pull_request'
      id: changed-files
      run: |
        # Get changed files using git diff
        if git diff --name-only --diff-filter=d origin/${{ github.base_ref }}..HEAD | grep -E '\.(md|html|rst)$' > changed_files.txt; then
          if [ -s changed_files.txt ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
            echo "changed_files_list=$(cat changed_files.txt | sed 's|^|'"'"'${{ github.workspace }}/|; s|$|'"'"'|' | tr '\n' ' ')" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "any_changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Echo changed files in the PR
      if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
      run: |
        echo "Files being checked: ${{ steps.changed-files.outputs.changed_files_list }}"

    # Pass 1: lychee checks everything. It does not fail the job; its failures are
    # written to a JSON report and re-verified in pass 2, because lychee cannot
    # reach some sites that gate on TLS fingerprint (e.g. analog.com behind a WAF).
    - name: URL checker (PR - changed files only)
      if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
      uses: lycheeverse/lychee-action@v2
      with:
        workingDirectory: .github/workflows
        format: json
        output: lychee-report.json
        jobSummary: false
        args: >-
          --accept=200,403,429
          --max-retries=5
          --retry-wait-time=2
          --no-progress
          --root-dir=${{ github.workspace }}
          --remap='(file://.*)/holoscan-sdk/(.*) https://github.com/nvidia-holoscan/holoscan-sdk/tree/main/$2'
          ${{ steps.changed-files.outputs.changed_files_list }}
        fail: false
        failIfEmpty: false

    - name: URL checker (all files)
      if: github.event_name == 'push'
      uses: lycheeverse/lychee-action@v2
      with:
        workingDirectory: .github/workflows
        format: json
        output: lychee-report.json
        jobSummary: false
        args: >-
          --accept=200,403,429
          --max-retries=5
          --retry-wait-time=2
          --no-progress
          --root-dir=${{ github.workspace }}
          --remap='(file://.*)/holoscan-sdk/(.*) https://github.com/nvidia-holoscan/holoscan-sdk/tree/main/$2'
          '${{ github.workspace }}/**/*.md'
          '${{ github.workspace }}/**/*.html'
          '${{ github.workspace }}/**/*.rst'
        fail: false
        failIfEmpty: false

    # Pass 2: re-verify lychee's failures with a browser-impersonating HEAD. A URL
    # stays failed only if it cannot be confirmed (not HTTP 200), so real dead
    # links (404) still fail while WAF false positives are rescued.
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Re-check lychee failures with browser impersonation
      run: |
        pip install curl_cffi
        python .github/workflows/scripts/recheck_failed_urls.py .github/workflows/lychee-report.json
