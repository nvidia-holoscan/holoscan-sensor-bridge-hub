name: Experiment curl-impersonate

# Temporary experiment: can curl_cffi (browser TLS fingerprint impersonation)
# verify the analog.com pages from a GitHub runner, where lychee and
# markdown-link-check are blocked by the WAF? Delete after the result.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - name: Verify existence via HEAD (real must be 200, bogus must be 404)
        run: |
          python - <<'PY'
          import sys
          from curl_cffi import requests

          real = [
              "https://www.analog.com/en/products/adtf3175.html",
              "https://www.analog.com/en/products/adis16505.html",
              "https://www.analog.com/en/products/adis16607.html",
              "https://www.analog.com/en/products/ad2428.html",
              "https://www.analog.com/en/products/ad2427.html",
          ]
          bogus = "https://www.analog.com/en/products/zzz-nonexistent-xyz-98765.html"

          def head(u):
              return requests.head(u, impersonate="chrome", timeout=30, allow_redirects=True).status_code

          fail = []
          for u in real:
              s = head(u)
              print("REAL ", s, u)
              if s != 200:
                  fail.append((u, s))  # a real page must resolve to 200
          s = head(bogus)
          print("BOGUS", s, bogus)
          if s != 404:
              fail.append((bogus, s))  # the check must detect a missing page as 404
          sys.exit(1 if fail else 0)
          PY
