# Run `pre-commit autoupdate` to refresh to latest compatible versions.
# Hook settings live in tools/lint/; tool versions for CI are in tools/lint/requirements.txt.

repos:
  # General: pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending

  # Python: ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix, --ignore, E712, --config, tools/lint/pyproject.toml]

  # Python: isort
  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: [--settings-path, tools/lint/pyproject.toml]

  # Python: black
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.3.1
    hooks:
      - id: black
        args: [--config, tools/lint/pyproject.toml]
        # Mirror tools/lint/pyproject.toml [tool.black] extend-exclude
        exclude: |
          (?x)(
            ^\.cache/
            | ^build[^/]*/
            | ^install[^/]*/
            | ^\.local/
            | \.ipynb$
          )

  # Spelling: codespell
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args:
          - --write-changes
          - --ignore-words=tools/lint/codespell_ignore_words.txt
          - --skip=*.onnx,*.min.js,*.min.js.map,./data/

  # C++: cpplint
  - repo: https://github.com/cpplint/cpplint
    rev: 2.0.2
    hooks:
      - id: cpplint
        args:
          - --quiet
          - --linelength=100
          - --filter=-build/header_guard,-readability/todo,-runtime/references,-build/c++11,-build/c++17,-runtime/int,-build/include_subdir,-build/namespaces,-readability/casting,-build/include,-runtime/threadsafe_fn,-whitespace/newline,-whitespace/indent_namespace,-readability/nolint

  # Markdown: markdownlint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.48.0
    hooks:
      - id: markdownlint
        args: [--fix, --config, tools/lint/.markdownlint.yaml]

  # Copyright header check (NVIDIA SPDX)
  - repo: local
    hooks:
      - id: check-copyright
        name: check-copyright
        entry: python3 .github/workflows/scripts/check_copyright.py
        args:
          - .
          - --git-modified-only
          - --exclude-config
          - .github/workflows/scripts/copyright_excludes.txt
          - --update-current-year
        language: system
        pass_filenames: false
